<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Arco. Make practice feel like progress.</title>
  <desc id="desc">A music practice studio in your browser. The Bridge mark and warm tan lettering sit on a charcoal background. On a musical staff, a translucent live note sits beside an amber target, showing your sound in real time. Live pitch feedback, guided practice, and audio that stays on your device.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#211e1a"/><stop offset="1" stop-color="#171513"/></linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c9a47e" stop-opacity=".13"/><stop offset="1" stop-color="#c9a47e" stop-opacity=".04"/></linearGradient>
    <linearGradient id="sound" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c9a47e" stop-opacity="0"/><stop offset=".25" stop-color="#c9a47e" stop-opacity=".35"/><stop offset=".75" stop-color="#c9a47e" stop-opacity=".6"/><stop offset="1" stop-color="#c9a47e" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1600" height="640" fill="url(#background)"/>
  <rect x=".5" y=".5" width="1599" height="639" fill="none" stroke="#3d352d"/>
  <path d="M80 547H1520" stroke="#3d352d"/>
  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
    <svg x="78" y="64" width="49" height="49" viewBox="8 10 48 48">
      <path fill="#c9a47e" d="M17 20Q32 13 47 20L48 28C43 28 42 30 43 33S47 37 50 36L54 51H40L38 42C37 38 27 38 26 42L24 51H10L14 36C17 37 20 36 21 33S21 28 16 28L17 20Z"/>
    </svg>
    <text x="143" y="103" fill="#eee7de" font-size="50" font-weight="500" letter-spacing="-2">arco</text>
    <text x="1520" y="96" text-anchor="end" fill="#aa9e91" font-size="15" font-weight="500" letter-spacing="3">ONE NOTE AT A TIME</text>
    <text x="78" y="257" fill="#eee7de" font-size="76" font-weight="500" letter-spacing="-3.4">Make practice</text>
    <text x="78" y="345" fill="#c9a47e" font-size="76" font-weight="500" letter-spacing="-3.4">feel like progress.</text>
    <text x="82" y="411" fill="#c4b6a6" font-size="25" letter-spacing="-.35">A music practice studio in your browser.</text>
    <g fill="#aa9e91" font-size="19">
      <text x="82" y="486">Listen.</text><text x="164" y="486">Adjust.</text><text x="252" y="486">Play again.</text>
    </g>
    <text x="82" y="594" fill="#c4b6a6" font-size="18">Live pitch feedback</text>
    <circle cx="288" cy="588" r="2" fill="#805f43"/>
    <text x="312" y="594" fill="#c4b6a6" font-size="18">Guided practice</text>
    <circle cx="485" cy="588" r="2" fill="#805f43"/>
    <text x="509" y="594" fill="#c4b6a6" font-size="18">On your device</text>
    <text x="1520" y="594" text-anchor="end" fill="#aa9e91" font-size="16" letter-spacing="1">PRIVATE. SELF-HOSTABLE. YOURS.</text>
  </g>
  <g>
    <text x="911" y="187" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="2.7" fill="#aa9e91">SEE WHAT YOU PLAY</text>
