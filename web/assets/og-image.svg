<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>Arco. Learn violin, one note at a time.</title>
<desc>A beginner violin practice space with an amber A4 target, a faded teal A5 showing the player's live sound, ledger lines, and a down arrow guiding it toward the target. Below, a realistic fingerboard highlights the open A string. Works in your browser and keeps audio on your device.</desc>
